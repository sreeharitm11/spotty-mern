services:
  # Backend API (Express + Mongo)
  - type: web
    name: spotty-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Set this in Render dashboard (do not hardcode secrets):
      # - key: MONGO_URI
      #   sync: false
      # - key: CLIENT_URL
      #   value: https://<your-vercel-app>.vercel.app

  # Frontend (Vite build)
  - type: static
    name: spotty-client
    rootDir: client/spotty-client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      # Set these in Render dashboard or keep here if non-secret.
      # VITE_* are embedded at build time.
      # - key: VITE_API_URL
      #   value: https://<spotty-api>.onrender.com/api
      # - key: VITE_SOCKET_URL
      #   value: https://<spotty-api>.onrender.com
      # - key: VITE_MAPPLS_KEY
      #   sync: false

